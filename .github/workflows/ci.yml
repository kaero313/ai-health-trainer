name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness test dependency
        run: python -m pip install pytest

      - name: Check generated role files and skill mirror
        run: python scripts/harness.py render --check

      - name: Run harness self tests
        run: python -m pytest tests -q

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run ruff
        run: |
          cd backend
          python -m ruff check .

      - name: Check app entrypoint imports
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci
          GEMINI_API_KEY: dummy-key-for-test
        run: |
          cd backend
          python -c "import app.main"

      - name: Check single alembic head
        run: |
          cd backend
          heads=$(alembic heads | grep -c '(head)')
          echo "alembic heads: $heads"
          test "$heads" = "1"

      - name: Run backend tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/health_trainer_test
          TEST_DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          JWT_SECRET_KEY: test-secret-key-for-ci
          GEMINI_API_KEY: dummy-key-for-test
          REDIS_URL: redis://localhost:6379/0
          TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          cd backend
          pytest tests/ -v --tb=short

  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run flutter analyze
        run: |
          cd frontend
          flutter analyze

      - name: Run flutter test
        run: |
          cd frontend
          flutter test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      # AGP·Gradle·Kotlin 설정이 깨지면 analyze/test는 통과해도 빌드가 실패한다
      - name: Build debug APK
        run: |
          cd frontend
          flutter build apk --debug
